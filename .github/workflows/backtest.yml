# בדיקה היסטורית (חד-פעמית, ידנית): מריצה את backtest.py ושומרת את הדוח בתיקיית backtest/

name: backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pandas numpy

      - name: הרצת הבדיקה ההיסטורית
        shell: bash
        run: |
          mkdir -p backtest
          python -u -W ignore backtest.py 2>&1 | tee backtest/backtest_log.txt

      - name: שמירת התוצאות במאגר
        if: always()
        run: |
          git config user.name "marketpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add backtest
          git commit -m "תוצאות בדיקה היסטורית" || echo "אין שינויים לשמור"
          git pull --rebase
          git push
