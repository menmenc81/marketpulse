# קובץ זה אומר ל-GitHub: "כל יום, בשעה מסוימת, תריץ את fetch_data.py
# ותשמור את התוצאה (index.html) בחזרה למאגר, כדי שהאתר יתעדכן."

name: daily

on:
  # מריץ אוטומטית כל יום בשעה 04:00 UTC (בערך 06:00-07:00 שעון ישראל, תלוי בשעון קיץ/חורף)
  schedule:
    - cron: "0 4 * * *"
  # מאפשר גם הרצה ידנית מתוך לשונית Actions באתר GitHub
  workflow_dispatch: {}

# מאפשר לתהליך לשמור (לבצע commit) קובץ מעודכן חזרה למאגר
permissions:
  contents: write

jobs:
  build-and-update:
    # גרסה מקובעת, כדי שמעבר ubuntu-latest לגרסה חדשה לא ישבור את הריצה בלי התראה
    runs-on: ubuntu-24.04
    steps:
      - name: הורדת הקוד מהמאגר
        uses: actions/checkout@v6

      - name: התקנת פייתון
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: התקנת הספריות הנדרשות
        run: pip install -r requirements.txt

      - name: הרצת הסקריפט שמושך נתונים ובונה את הדשבורד
        # shell: bash מפעיל גם pipefail, כדי שכשל בסקריפט לא יוסתר על ידי tee
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # -W ignore מסתיר אזהרות ארוכות של הספריות. התוצאה נשמרת גם בקובץ run_log.txt
        run: python -u -W ignore fetch_data.py 2>&1 | tee run_log.txt

      - name: שמירת הדשבורד המעודכן בחזרה למאגר
        if: always()   # גם אם הסקריפט נכשל, כדי שיומן השגיאה יישמר
        run: |
          git config user.name "marketpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html signals_log.json run_log.txt
          git commit -m "עדכון יומי אוטומטי" || echo "אין שינויים לשמור"
          git push
